<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="300" rx="12" fill="#fafafa"/>
  <rect width="900" height="300" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">栈后进先出、队列先进先出：出入口的位置决定语义</text>

  <rect x="40" y="58" width="400" height="200" rx="10" fill="#e8eaf6" stroke="#283593" stroke-width="2"/>
  <text x="240" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#283593">栈 Stack（LIFO）</text>
  <rect x="180" y="150" width="120" height="34" fill="#c5cae9" stroke="#283593"/>
  <rect x="180" y="182" width="120" height="34" fill="#c5cae9" stroke="#283593"/>
  <rect x="180" y="118" width="120" height="34" fill="#9fa8da" stroke="#283593"/>
  <text x="240" y="140" text-anchor="middle" font-size="12" fill="#1a237e">top</text>
  <line x1="330" y1="135" x2="330" y2="100" stroke="#c62828" stroke-width="2" marker-end="url(#b)"/>
  <line x1="330" y1="100" x2="330" y2="135" stroke="#2e7d32" stroke-width="2" marker-end="url(#b)"/>
  <text x="360" y="120" font-size="11" fill="#37474f">push/pop 同一端</text>
  <text x="240" y="242" text-anchor="middle" font-size="12" fill="#283593">函数调用栈、括号匹配、单调栈、DFS</text>

  <rect x="460" y="58" width="400" height="200" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
  <text x="660" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#00695c">队列 Queue（FIFO）</text>
  <rect x="540" y="120" width="50" height="40" fill="#b2dfdb" stroke="#00695c"/>
  <rect x="590" y="120" width="50" height="40" fill="#b2dfdb" stroke="#00695c"/>
  <rect x="640" y="120" width="50" height="40" fill="#b2dfdb" stroke="#00695c"/>
  <rect x="690" y="120" width="50" height="40" fill="#b2dfdb" stroke="#00695c"/>
  <text x="515" y="145" text-anchor="middle" font-size="11" fill="#004d40">出</text>
  <text x="765" y="145" text-anchor="middle" font-size="11" fill="#004d40">入</text>
  <line x1="540" y1="185" x2="500" y2="185" stroke="#c62828" stroke-width="2" marker-end="url(#b)"/>
  <line x1="790" y1="185" x2="745" y2="185" stroke="#2e7d32" stroke-width="2" marker-end="url(#b)"/>
  <text x="620" y="200" text-anchor="middle" font-size="11" fill="#37474f">队头出、队尾入</text>
  <text x="660" y="242" text-anchor="middle" font-size="12" fill="#00695c">BFS、生产者消费者、循环队列、单调队列</text>

  <defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#455a64"/></marker></defs>
  <text x="450" y="282" text-anchor="middle" font-size="12" fill="#78909c">都是「受限的数组/链表」：砍掉自由度，换来确定的语义</text>
</svg>
