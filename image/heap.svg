<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="320" rx="12" fill="#fafafa"/>
  <rect width="900" height="320" rx="12" fill="none" stroke="#e0e0e0"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">堆用数组存完全二叉树，父子靠下标换算</text>

  <text x="230" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">大顶堆（树形）</text>
  <circle cx="230" cy="100" r="22" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/><text x="230" y="105" text-anchor="middle" font-size="13" fill="#1b5e20">10</text>
  <circle cx="150" cy="160" r="22" fill="#c8e6c9" stroke="#2e7d32"/><text x="150" y="165" text-anchor="middle" font-size="13" fill="#1b5e20">7</text>
  <circle cx="310" cy="160" r="22" fill="#c8e6c9" stroke="#2e7d32"/><text x="310" y="165" text-anchor="middle" font-size="13" fill="#1b5e20">9</text>
  <circle cx="110" cy="220" r="20" fill="#e8f5e9" stroke="#2e7d32"/><text x="110" y="225" text-anchor="middle" font-size="12" fill="#1b5e20">3</text>
  <circle cx="190" cy="220" r="20" fill="#e8f5e9" stroke="#2e7d32"/><text x="190" y="225" text-anchor="middle" font-size="12" fill="#1b5e20">4</text>
  <circle cx="290" cy="220" r="20" fill="#e8f5e9" stroke="#2e7d32"/><text x="290" y="225" text-anchor="middle" font-size="12" fill="#1b5e20">8</text>
  <line x1="212" y1="118" x2="168" y2="145" stroke="#2e7d32"/><line x1="248" y1="118" x2="292" y2="145" stroke="#2e7d32"/>
  <line x1="138" y1="178" x2="118" y2="203" stroke="#2e7d32"/><line x1="162" y1="178" x2="182" y2="203" stroke="#2e7d32"/>
  <line x1="304" y1="178" x2="294" y2="203" stroke="#2e7d32"/>
  <text x="230" y="270" text-anchor="middle" font-size="12" fill="#1b5e20">堆序只管父≥子，不管左右大小</text>

  <text x="650" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">数组存储</text>
  <g>
    <rect x="500" y="88" width="46" height="40" fill="#bbdefb" stroke="#1565c0"/><text x="523" y="113" text-anchor="middle" font-size="13" fill="#0d47a1">10</text>
    <rect x="546" y="88" width="46" height="40" fill="#e3f2fd" stroke="#1565c0"/><text x="569" y="113" text-anchor="middle" font-size="13" fill="#0d47a1">7</text>
    <rect x="592" y="88" width="46" height="40" fill="#e3f2fd" stroke="#1565c0"/><text x="615" y="113" text-anchor="middle" font-size="13" fill="#0d47a1">9</text>
    <rect x="638" y="88" width="46" height="40" fill="#e3f2fd" stroke="#1565c0"/><text x="661" y="113" text-anchor="middle" font-size="13" fill="#0d47a1">3</text>
    <rect x="684" y="88" width="46" height="40" fill="#e3f2fd" stroke="#1565c0"/><text x="707" y="113" text-anchor="middle" font-size="13" fill="#0d47a1">4</text>
    <rect x="730" y="88" width="46" height="40" fill="#e3f2fd" stroke="#1565c0"/><text x="753" y="113" text-anchor="middle" font-size="13" fill="#0d47a1">8</text>
  </g>
  <text x="523" y="144" text-anchor="middle" font-size="10" fill="#546e7a">0</text><text x="569" y="144" text-anchor="middle" font-size="10" fill="#546e7a">1</text><text x="615" y="144" text-anchor="middle" font-size="10" fill="#546e7a">2</text><text x="661" y="144" text-anchor="middle" font-size="10" fill="#546e7a">3</text><text x="707" y="144" text-anchor="middle" font-size="10" fill="#546e7a">4</text><text x="753" y="144" text-anchor="middle" font-size="10" fill="#546e7a">5</text>
  <text x="650" y="185" text-anchor="middle" font-size="12" fill="#0d47a1">左孩子 2i+1　右孩子 2i+2　父 (i-1)/2</text>
  <text x="650" y="212" text-anchor="middle" font-size="12" fill="#0d47a1">无需指针，连续存储、cache 友好</text>
  <text x="650" y="248" text-anchor="middle" font-size="11" fill="#37474f">push/pop 上浮/下沉 O(log n)，top O(1)</text>
  <text x="650" y="270" text-anchor="middle" font-size="11" fill="#37474f">自底向上建堆 O(n)</text>

  <text x="450" y="306" text-anchor="middle" font-size="12" fill="#78909c">优先队列的底座；Top K 求最大用小顶堆、求最小用大顶堆</text>
</svg>
